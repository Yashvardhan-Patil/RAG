[project]
name = "rag-eval-studio"
version = "0.1.0"
description = "A lightweight dashboard for RAG evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "gradio>=5.0",
    "litellm>=1.70",
]

[project.scripts]
rag-eval-studio = "rag_eval_studio.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
