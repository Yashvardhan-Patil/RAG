services:
  - type: web
    name: rag-eval-studio
    runtime: python
    buildCommand: pip install uv && uv sync --no-group dev
    startCommand: uv run rag-eval-studio
    plan: free                   # Change to "starter" for persistent disk + no spin-down
    envVars:
      - key: RAG_EVAL_HOST
        value: 0.0.0.0           # Required — Render routes external traffic to 0.0.0.0
      - key: RAG_EVAL_PORT
        value: 10000             # Required — Render expects port 10000 by default
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.12"
      # ── Set secrets in the Render dashboard under Environment → Secret Files
      # ── or as individual environment variables. Never commit real keys here.
      #
      # GROQ (recommended — fast free tier, great for judge)
      # - key: GROQ_API_KEY
      #   sync: false
      #
      # OpenAI (optional)
      # - key: OPENAI_API_KEY
      #   sync: false
      #
      # Anthropic (optional)
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      #
      # Cohere (optional)
      # - key: COHERE_API_KEY
      #   sync: false
